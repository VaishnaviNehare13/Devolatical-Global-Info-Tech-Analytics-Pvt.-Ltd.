server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing: Redirect all unknown non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for Backend API requests
    location /api/v1 {
        proxy_pass http://backend:5000/api/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase upload body limit for document uploads (e.g. 50MB)
        client_max_body_size 50M;
    }

    # Block direct access to internal upload directory
    # Document and resume access must be authenticated through backend routes
    location /uploads {
        deny all;
        return 403;
    }

    # Basic Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
